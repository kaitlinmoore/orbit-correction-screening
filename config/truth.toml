# Truth propagator configuration (read by orbit_correction.truth_prop.load_truth_config).
# Every value here is an instrument: "truth" in this study is whatever this file says,
# so log each change in docs/changelog.md with its reason.
#
# Force model and integrator approved as decision 1 (2026-11-23): Orekit numerical
# propagator, EIGEN-6S zonal harmonics (order 0), NRLMSISE-00 drag fed by the
# project's space-weather copy, Cd 2.2 with area-to-mass from B*, DOP853 at about 1 m
# position tolerance. The truth-definition settings below (zonal degree, NRLMSISE-00
# local solar time and switch 9, maximum step, start rule, re-entry) were decided by
# Kaitlin on 2026-11-23 after review; the start rule was changed by her on 2026-11-25
# (see [truth.start]).

[truth]
status = "exploratory 2026-11-23 (truth settings decided 2026-11-23; start rule changed 2026-11-25)"

[truth.data]
# orekit-data bundle (EOP, leap seconds, EIGEN-6S, DE-440). Must match the commit
# pinned in pyproject.toml / uv.lock; truth_prop checks the installed package's
# version string against it at JVM start.
orekit_data_commit = "2d6edc9118983d95c51303df05db16ada90b7ee2"

[truth.gravity]
# ICGEM file name inside the bundle. Its time-variable low-degree terms (gfct, trnd,
# acos, asin) are evaluated by Orekit at each date.
field_file = "eigen-6s.gfc"
# Zonal degree 36: a chosen truncation that is part of the truth definition (decided
# 2026-11-23), not a converged value. Truth is "EIGEN-6S zonals to degree 36"; the
# omitted zonals above 36 move a 7-day trajectory by up to ~70 m at 300 km, ~18 m at
# 500 km, ~8 m at 800 km and ~1 m at 1,200 km (scripts/zonal_convergence.py, against a
# degree-90 reference, background only; table in the changelog entry of 2026-11-23).
zonal_degree = 36
# Order 0: zonal terms only, by design (tesserals are a stated limitation).
zonal_order = 0

[truth.drag]
# "NRLMSISE-00" or "none" (none exists for tests that isolate gravity).
atmosphere = "NRLMSISE-00"
cd = 2.2
# Standard SGP4 B* relation, B* = (Cd * A/m) * rho0 / 2, so A/m = 2 B* / (Cd rho0).
# rho0 = 2.461e-8 kg/m^3 (the SGP4 reference density, about the density at its
# q0 = 120 km reference altitude) times 6378.135 km per Earth radius
# = 0.15696615 kg / (m^2 * Earth radius), so that B* comes out in 1/ER.
# Value as given by Vallado, Fundamentals of Astrodynamics and Applications (4th ed.,
# 2013), B* discussion, and used by Vallado, Crawford, Hujsak and Kelso (2006),
# "Revisiting Spacetrack Report #3", AIAA 2006-6753. B* is a fitted SGP4 parameter,
# so this gives a model-world A/m, not a measured one.
bstar_reference_density_kg_per_m2_er = 0.15696615
# Mass cancels (drag acceleration depends on A/m only); it exists because Orekit's
# drag model takes an area and the state carries a mass.
mass_kg = 100.0
# NRLMSISE-00 settings (decided 2026-11-23; not part of decision 1).
# Local solar time "MEAN" (UT + longitude/15). This is what pymsis and brahe compute,
# so it is the setting under which Orekit's density can be checked against them
# (pymsis to 1.1e-5). It is not "the reference convention": the reference notes name
# the input local *apparent* solar time, give UT + longitude/15 as the consistent
# formula and call equation-of-time departures of minor importance. Orekit 13.1.9's
# public constructors pass "APPARENT" (true Sun hour angle) although its class
# documentation says mean is the default. Along real orbits apparent differs from mean
# by up to 6.8% in density (800 km, November 2024).
msis_local_solar_time = "MEAN"
# Switch 9: 1 = daily Ap only (Orekit and pymsis default), -1 = full ap array with
# 3-hourly values (storm-time mode). -1, so 3-hour geomagnetic activity reaches the
# truth density. Kept configurable: step 3 runs a labeled daily-Ap (+1) sensitivity
# subsample.
msis_ap_switch = -1

[truth.earth]
# Earth orientation and the Earth-fixed frame for gravity, drag and altitude.
iers_conventions = "IERS_2010"
# simpleEOP = true skips the tidal corrections to EOP interpolation (Orekit's usual
# speed setting; sub-metre at LEO).
simple_eop = true
body_shape = "WGS84"

[truth.integrator]
method = "DOP853"
# Position tolerance passed to Orekit's default tolerance provider (Cartesian state).
position_tolerance_m = 1.0
min_step_s = 0.001
# Maximum step 180 s (decided 2026-11-23; was 300 s). At these settings DOP853 runs at
# the step cap, so the step, not the 1 m tolerance, sets the integration error. Its
# 7-day error against a converged run (1 mm, 30 s) is recorded per altitude band in the
# changelog entry of 2026-11-23 and bounded per band in tests/test_truth_prop.py.
max_step_s = 180.0

[truth.start]
# Start rule. Decided by Kaitlin on 2026-11-25: "fit_to_sgp4_before_epoch" with a
# 0.25-day span at 60 s, replacing "preserve_sgp4_mean_motion" (decided 2026-11-23).
# Evidence (scripts/fitted_start_comparison.py, 2026-11-24): a start at the SGP4 epoch
# state leaves a phase-dependent along-track drift that a model would learn (spread of
# 7-day T across four phases 19-1,890 km per stratum, median); the 0.25-day fit cuts it
# to about 0.9 km, absorbs little of the drag-model difference at 250-400 km (+4.6% in
# near-circular 7-day T, against +17% at a 1-day span) and costs 1.47x the truth
# compute per window (2.69x at 1 day).
# "fit_to_sgp4_before_epoch": the truth state at the epoch is fitted by least squares
#   to SGP4's GCRF positions over [epoch - fit_span_days, epoch], propagating backwards
#   with this file's full force model; only SGP4 states at or before the epoch enter
#   the fit. Needs the SGP4 samples (truth_prop.fit_samples_from_elsets) and a
#   space-weather copy that covers the fit span; a fit that doesn't converge gives
#   status "fit_failed", and a job without samples is refused, never started from the
#   epoch state instead.
# Epoch-state rules, kept for comparison (callers must name them explicitly). The
# initial state is the SGP4 state at the element-set epoch rotated TEME -> GCRF
# (frames.teme_to_gcrf). SGP4 states are consistent with the WGS-72 GM; truth
# integrates with the EIGEN-6S GM, which alone would make truth lag SGP4 by about
# 1.15 km per day.
# "preserve_sgp4_mean_motion": position and velocity both multiplied by
#   k = (mu_truth / sgp4_mu) ** (1/3), which keeps the two-body period (under each
#   model's own GM), eccentricity and orientation; the state moves by about 2 m.
#   Keeps the phase-dependent drift.
# "sgp4_state_direct": k = 1, the SGP4 state as is.
rule = "fit_to_sgp4_before_epoch"
# GM SGP4 works with: WGS-72, km^3/s^2 (sgp4.earth_gravity.wgs72.mu; cheap_prop uses
# WGS-72). The truth GM is read from the gravity field (EIGEN-6S: 398600.4415). Used by
# the epoch-state rules and for the fitted rule's initial guess.
sgp4_mu_km3_s2 = 398600.8
# Fitted start only (ignored by the other rules). Span before the epoch, days
# (decided 2026-11-25; the comparison also ran 0.125, 0.5, 1 and 2 days). About four
# LEO revolutions: enough to average SGP4's short-periodic terms, short enough that
# little of the drag-model difference is absorbed into the start.
fit_span_days = 0.25
# Spacing of the SGP4 samples, s (backwards from the epoch, so the last is the epoch).
# 60 s gives about 100 samples per LEO revolution (361 over 0.25 days); the cost is
# the backward integration, not the number of samples.
fit_step_s = 60.0
# Gauss-Newton passes (each one backward integration with the state transition
# matrix). The fit typically converges in 3.
fit_max_iterations = 8
# Converged when the last correction to the epoch state is below both: 1 mm and
# 1 micrometre/s. A velocity error of 1e-6 m/s moves a 7-day trajectory by about 2 m.
fit_tolerance_m = 0.001
fit_tolerance_m_s = 0.000001

[truth.output]
# Default output spacing for callers that build a regular grid (truth_prop.output_grid).
# Output is sampled from Orekit's ephemeris generator (dense output of one
# integration), never by repeated propagate() calls.
step_s = 60.0

[truth.reentry]
# Stop and report status "reentry" if the geodetic altitude (WGS84) drops below this
# inside the window (decided 2026-11-23). The result also carries the truth
# trajectory up to the stop time, so close approaches before re-entry stay usable. A
# start already below it returns "reentry" at once with no trajectory. 120 km is the
# conventional entry interface; below it an object completes at most a few more
# revolutions. The matching SGP4 floor belongs to cheap_prop.py.
altitude_km = 120.0
# Interval between altitude checks during integration (s).
max_check_s = 60.0

[truth.jvm]
# Each JVM is capped at this many processors (-XX:ActiveProcessorCount). Without a
# cap every JVM sizes its GC and JIT thread pools for all 24 CPUs and parallel
# workers oversubscribe the machine (project research, 2026-11-23).
active_processor_count = 2
